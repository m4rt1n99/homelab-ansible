---
# --- Packages ---
- name: Update and upgrade apt packages
  become: true
  apt:
    upgrade: yes
    update_cache: yes
    cache_valid_time: 86400 #One day

- name: Install common packages
  become: true
  apt:
    name:
      - ufw
      - samba
      - zfsutils-linux

# --- Storage ---
- name: Mount NVMe disk
  ansible.builtin.mount:
    src: "/dev/disk/by-uuid/{{ nvme_uuid }}"
    path: "/mnt/nvme"
    fstype: "ext4"
    opts: "defaults,nofail"
    state: mounted

# --- Firewall ---
- name: Configure UFW default incoming policy
  community.general.ufw:
    direction: incoming
    policy: deny

# Podman publishes ports via DNAT, so inbound traffic to containers traverses the
# FORWARD chain. UFW defaults that chain to DROP, which blocks all published
# container ports. Allow routed traffic so published ports are reachable.
- name: Configure UFW default routed (forward) policy
  community.general.ufw:
    direction: routed
    policy: allow

- name: Allow SSH
  community.general.ufw:
    rule: allow
    port: "22"
    proto: tcp

# Per-service ports are opened by each service role, so a host only opens ports for the roles it actually runs
- name: Configure UFW logging
  community.general.ufw:
    logging: low

- name: Enable UFW
  community.general.ufw:
    state: enabled

# --- Cleanup ---
- name: Remove unnecessary packages
  ansible.builtin.apt:
    autoremove: true
    autoclean: true
