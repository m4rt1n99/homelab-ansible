---

# --- Recover orphaned state ---
- name: Check gluetun service state
  ansible.builtin.systemd:
    name: gluetun.service
  register: gluetun_state
  failed_when: false

- name: Remove orphaned gluetun container and its dependents
  ansible.builtin.command:
    cmd: podman rm --force --ignore --depend gluetun
  register: gluetun_orphan_rm
  changed_when: gluetun_orphan_rm.stdout | trim | length > 0
  when: gluetun_state.status.ActiveState | default('inactive') != 'active'

# --- Directories ---
- name: Create gluetun directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: '0755'
  loop:
    - /mnt/nvme/services/gluetun   # /gluetun (VPN state)

# --- Deploy ---
- name: Deploy gluetun container Quadlet
  ansible.builtin.template:
    src: gluetun.container.j2
    dest: /etc/containers/systemd/gluetun.container
    mode: '0644'
  notify:
    - Reload systemd
    - Restart gluetun

- name: Reload systemd to register new units
  ansible.builtin.meta: flush_handlers

- name: Start gluetun service
  ansible.builtin.systemd:
    name: gluetun
    state: started
    enabled: true

# --- Firewall ---
- name: Allow qbittorrent WebUI port through UFW (published by gluetun)
  community.general.ufw:
    rule: allow
    route: true   # published ports are DNAT'd to the container; routed via FORWARD, not INPUT
    port: "{{ service_ports.qbittorrent_published }}"
    proto: tcp
  notify: Reload ufw
