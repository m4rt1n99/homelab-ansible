---
- name: Compute Navidrome Subsonic API token
  ansible.builtin.set_fact:
    navidrome_token: "{{ (navidrome_password ~ navidrome_salt) | hash('md5') }}"

- name: Create homepage directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: '0755'
  loop:
    - /mnt/nvme/services/homepage
    - /mnt/nvme/services/homepage/config

- name: Deploy homepage container Quadlet
  ansible.builtin.template:
    src: homepage.container.j2
    dest: /etc/containers/systemd/homepage.container
    mode: '0644'
  notify:
    - Reload systemd
    - Restart homepage

# Read service API keys from the files each service persists, so homepage does not depend
# on immich/jellyfin running in the same play. Missing key -> empty fact -> widget omitted.
- name: Stat persisted widget API keys
  ansible.builtin.stat:
    path: "/mnt/nvme/services/{{ item }}/homepage_api_key"
  loop:
    - immich
    - jellyfin
  register: widget_api_key_files

- name: Read persisted widget API keys
  ansible.builtin.slurp:
    src: "{{ item.stat.path }}"
  loop: "{{ widget_api_key_files.results }}"
  loop_control:
    label: "{{ item.item }}"
  when: item.stat.exists
  register: widget_api_key_slurps

- name: Expose widget API keys as facts (empty when not yet provisioned)
  ansible.builtin.set_fact:
    immich_api_key: "{{ widget_api_key_slurps.results | selectattr('item.item', 'equalto', 'immich') | selectattr('content', 'defined') | map(attribute='content') | first | default('') | b64decode | trim }}"
    jellyfin_api_key: "{{ widget_api_key_slurps.results | selectattr('item.item', 'equalto', 'jellyfin') | selectattr('content', 'defined') | map(attribute='content') | first | default('') | b64decode | trim }}"

- name: Deploy homepage config
  ansible.builtin.template:
    src: "{{ item.src }}"
    dest: "/mnt/nvme/services/homepage/config/{{ item.dest }}"
    mode: '0644'
  loop:
    - { src: homepage-services.yaml.j2, dest: services.yaml }
    - { src: homepage-settings.yaml.j2, dest: settings.yaml }
    - { src: homepage-custom.css.j2, dest: custom.css }
  notify: Restart homepage

- name: Reload systemd to register new units
  ansible.builtin.meta: flush_handlers

- name: Start homepage service
  ansible.builtin.systemd:
    name: homepage
    state: started
    enabled: true

- name: Allow homepage port through UFW
  community.general.ufw:
    rule: allow
    route: true   # published port is DNAT'd to the container; routed via FORWARD, not INPUT
    port: "{{ service_ports.homepage }}"
    proto: tcp
  notify: Reload ufw