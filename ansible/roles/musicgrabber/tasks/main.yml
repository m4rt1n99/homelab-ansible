---
- name: Create musicgrabber directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: '0755'
  loop:
    - /mnt/nvme/musicgrabber
    - /mnt/nvme/musicgrabber/data

- name: Deploy musicgrabber container Quadlet
  ansible.builtin.template:
    src: musicgrabber.container.j2
    dest: /etc/containers/systemd/musicgrabber.container
    mode: '0644'
  notify:
    - Reload systemd
    - Restart musicgrabber

- name: Reload systemd to register new units
  ansible.builtin.meta: flush_handlers

- name: Start musicgrabber service
  ansible.builtin.systemd:
    name: musicgrabber
    state: started
    enabled: true

- name: Allow musicgrabber ports through UFW
  community.general.ufw:
    rule: allow
    port: "{{ item }}"
    proto: tcp
  loop:
    - "{{ service_ports.musicgrabber }}"   # web UI
    - "38274"
  notify: Reload ufw