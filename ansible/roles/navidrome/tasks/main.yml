---
# --- Directories ---
- name: Create navidrome directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: '0755'
  loop:
    - /mnt/nvme/services/navidrome
    - /mnt/nvme/services/navidrome/data

- name: Create navidrome music library directory
  ansible.builtin.file:
    path: /mnt/nvme/media/navidrome   # mounted into the container as /music
    state: directory
    mode: '0755'

# --- Deploy ---
- name: Deploy navidrome container Quadlet
  ansible.builtin.template:
    src: navidrome.container.j2
    dest: /etc/containers/systemd/navidrome.container
    mode: '0644'
  notify:
    - Reload systemd
    - Restart navidrome

- name: Reload systemd to register new units
  ansible.builtin.meta: flush_handlers

- name: Start navidrome service
  ansible.builtin.systemd:
    name: navidrome
    state: started
    enabled: true

# --- Firewall ---
- name: Allow navidrome port through UFW
  community.general.ufw:
    rule: allow
    route: true   # published port is DNAT'd to the container; routed via FORWARD, not INPUT
    port: "{{ service_ports.navidrome }}"
    proto: tcp
  notify: Reload ufw
