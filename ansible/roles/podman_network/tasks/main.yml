---
# --- Packages ---
- name: Install Podman
  ansible.builtin.apt:
    name:
      - podman
      - uidmap
      - slirp4netns
    state: present
    update_cache: true

- name: Ensure Quadlet directory exists
  ansible.builtin.file:
    path: /etc/containers/systemd
    state: directory
    mode: '0755'

# --- Firewall ---
- name: Allow traffic from Podman containers to host
  community.general.ufw:
    rule: allow
    from_ip: 10.88.0.0/14
    comment: Podman containers to host (DNS, node_exporter, etc.)
  notify: Reload ufw

# The default routed policy is deny (common role), which would also block
# container-originated forwards. Allow anything sourced from the container
# subnets: VPN handshake, indexers, and inter-container traffic. Inbound to
# published ports stays gated by each role's own `route: true` rule.
- name: Allow container egress through the routed (forward) chain
  community.general.ufw:
    rule: allow
    route: true
    from_ip: 10.88.0.0/14
    comment: Container egress (VPN, indexers, inter-container)
  notify: Reload ufw

# --- Network ---
- name: Deploy vps-services network Quadlet
  ansible.builtin.template:
    src: vps-services.network.j2
    dest: /etc/containers/systemd/vps-services.network
    mode: '0644'
  notify: Reload systemd

- name: Reload systemd to register the network unit
  ansible.builtin.meta: flush_handlers

- name: Check whether the vps-services network exists
  ansible.builtin.command: podman network exists vps-services
  register: podman_network_check
  changed_when: false
  failed_when: false

- name: Create the vps-services network
  ansible.builtin.systemd:
    name: vps-services-network
    state: "{{ 'started' if podman_network_check.rc == 0 else 'restarted' }}"
