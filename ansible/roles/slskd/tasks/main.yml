---
# Owned by the slskd container user (PUID/PGID) so slskd can write its database.
- name: Create slskd config directory
  ansible.builtin.file:
    path: /mnt/nvme/services/slskd
    state: directory
    owner: "{{ media_puid }}"
    group: "{{ media_pgid }}"
    recurse: true
    mode: '0755'

- name: Create shared slskd download directory
  ansible.builtin.file:
    path: /mnt/nvme/media/slskd_downloads   # mounted into the container as /downloads
    state: directory
    owner: "{{ media_puid }}"
    group: "{{ media_pgid }}"
    recurse: true
    mode: '0755'

- name: Deploy slskd container Quadlet
  ansible.builtin.template:
    src: slskd.container.j2
    dest: /etc/containers/systemd/slskd.container
    mode: '0644'
  notify:
    - Reload systemd
    - Restart slskd

- name: Reload systemd to register new units
  ansible.builtin.meta: flush_handlers

- name: Start slskd service
  ansible.builtin.systemd:
    name: slskd
    state: started
    enabled: true

- name: Deploy slskd config
  ansible.builtin.blockinfile:
    path: /mnt/nvme/services/slskd/slskd.yml
    create: true
    mode: '0644'
    insertafter: EOF
    marker: "# {mark} ANSIBLE MANAGED BLOCK slskd"
    block: "{{ lookup('template', 'slskd-config.yml.j2') }}"
  notify: Restart slskd

- name: Allow slskd ports through UFW
  community.general.ufw:
    rule: allow
    route: true   # published ports are DNAT'd to the container; routed via FORWARD, not INPUT
    port: "{{ item }}"
    proto: tcp
  loop:
    - "{{ service_ports.slskd }}"   # web UI
    - "50300"                       # Soulseek peer/listen port
  notify: Reload ufw