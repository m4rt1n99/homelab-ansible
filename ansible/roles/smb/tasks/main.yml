---
# --- User ---
- name: Add SMB user if not present
  ansible.builtin.user:
    name: "{{ smb_username }}"
    password: "{{ smb_password | password_hash('sha512') }}"
    state: present
    system: true
    shell: /usr/sbin/nologin

- name: Set samba password for user
  ansible.builtin.command:
    cmd: smbpasswd -s -a {{ smb_username }}
    stdin: "{{ smb_password }}\n{{ smb_password }}"
  changed_when: false
  no_log: true

# --- Shares ---
# NOTE: write access also needs matching filesystem permissions. /mnt/storage/data
# is owned by the SMB user (zfs role). /mnt/nvme/media is owned by
# media_puid/media_pgid, so [Media] forces writes to run as media_username —
# files created over SMB land with the ownership the media containers expect.
- name: Add shares to smb.conf
  ansible.builtin.blockinfile:
    path: /etc/samba/smb.conf
    block: |
      [Storage]
      path = /mnt/storage/data
      browsable = yes
      writeable = yes
      [Media]
      path = /mnt/nvme/media
      browsable = yes
      writeable = yes
      force user = {{ media_username }}
    marker: "# {mark} ANSIBLE MANAGED - storage share"
    validate: testparm -s %s
  notify: Restart smbd

# --- Firewall ---
- name: Allow smb ports through UFW
  community.general.ufw:
    rule: allow
    port: 445
    proto: tcp
  notify: Reload ufw
