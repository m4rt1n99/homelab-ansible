---
# --- User ---
- name: Add samba user
  ansible.builtin.user:
    name: nas
    state: present
    system: true
    shell: /usr/sbin/nologin

- name: Set samba password for user
  ansible.builtin.shell: >
    (echo "{{ smb_password }}"; echo "{{ smb_password }}") | smbpasswd -s -a nas
  changed_when: false
  no_log: true

# --- Shares ---
- name: Add shares to smb.conf
  ansible.builtin.blockinfile:
    path: /etc/samba/smb.conf
    block: |
      [Storage]
      path = /mnt/storage/data
      read-only = no
      browsable = yes
      writeable = yes
      [Media]
      path = /mnt/nvme/media
      read-only = no
      browsable = yes
      writeable = yes
    marker: "# {mark} ANSIBLE MANAGED - storage share"
  notify: Restart smbd

# --- Firewall ---
- name: Allow smb ports through UFW
  community.general.ufw:
    rule: allow
    port: 445
    proto: tcp
  notify: Reload ufw
