---

# --- Directories ---
- name: Create sonarr config directory
  ansible.builtin.file:
    path: /mnt/nvme/services/sonarr       # /config
    state: directory
    mode: '0755'

# Owned by the lsio container user (PUID/PGID) so Sonarr can write the root folders.
- name: Create sonarr media directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ media_puid }}"
    group: "{{ media_pgid }}"
    recurse: true
    mode: '0755'
  loop:
    - /mnt/nvme/media/video/torrents/tv
    - /mnt/nvme/media/video/library/tv

# --- Deploy ---
- name: Deploy sonarr container Quadlet
  ansible.builtin.template:
    src: sonarr.container.j2
    dest: /etc/containers/systemd/sonarr.container
    mode: '0644'
  notify:
    - Reload systemd
    - Restart sonarr

# 0600: contains the API key. Ownership is left to the lsio init, which chowns
# /config to PUID/PGID on the container (re)start this change notifies.
- name: Deploy sonarr config
  ansible.builtin.template:
    src: "sonarr-config.xml.j2"
    dest: "/mnt/nvme/services/sonarr/config.xml"
    mode: '0600'
  notify: Restart sonarr

- name: Reload systemd to register new units
  ansible.builtin.meta: flush_handlers

- name: Start sonarr service
  ansible.builtin.systemd:
    name: sonarr
    state: started
    enabled: true

# --- Firewall ---
- name: Allow sonarr port through UFW
  community.general.ufw:
    rule: allow
    route: true   # published ports are DNAT'd to the container; routed via FORWARD, not INPUT
    port: "{{ service_ports.sonarr }}"
    proto: tcp
  notify: Reload ufw

# --- Configure qBitTorrent ---
- name: Wait for sonarr API to be ready
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ service_ports.sonarr }}/api/v3/system/status"
    headers:
      X-Api-Key: "{{ sonarr_api_key }}"
    status_code: 200
  register: sonarr_status
  until: sonarr_status.status == 200
  retries: 30
  delay: 2

- name: Get existing sonarr root folders
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ service_ports.sonarr }}/api/v3/rootfolder"
    headers:
      X-Api-Key: "{{ sonarr_api_key }}"
    status_code: 200
  register: sonarr_root_folders

- name: Add sonarr TV root folder
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ service_ports.sonarr }}/api/v3/rootfolder"
    method: POST
    headers:
      X-Api-Key: "{{ sonarr_api_key }}"
    body_format: json
    body:
      path: "/data/library/tv"
    status_code: 201
  when: sonarr_root_folders.json | selectattr('path', 'equalto', '/data/library/tv') | list | length == 0

- name: Get existing sonarr download clients
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ service_ports.sonarr }}/api/v3/downloadclient"
    headers:
      X-Api-Key: "{{ sonarr_api_key }}"
    status_code: 200
  register: sonarr_download_clients

- name: Add qbittorrent download client
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ service_ports.sonarr }}/api/v3/downloadclient"
    method: POST
    headers:
      X-Api-Key: "{{ sonarr_api_key }}"
    body_format: json
    body:
      name: "qBittorrent"
      enable: true
      protocol: "torrent"
      priority: 1
      removeCompletedDownloads: true   # delete the torrent + data once qBittorrent finishes seeding
      implementation: "qBittorrent"
      configContract: "QBittorrentSettings"
      fields:
        - name: "host"
          value: "gluetun"
        - name: "port"
          value: "{{ service_ports.qbittorrent }}"
        - name: "username"
          value: "{{ qbittorrent_username }}"
        - name: "password"
          value: "{{ qbittorrent_password }}"
        - name: "tvCategory"
          value: "tv"
    status_code: 201
  no_log: true   # body carries the qBittorrent password
  when: sonarr_download_clients.json | selectattr('name', 'equalto', 'qBittorrent') | list | length == 0
