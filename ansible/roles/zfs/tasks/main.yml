---
# --- User ---
# The dataset chown below needs the SMB user to exist. The smb role creates the
# same user for hosts that run it; re-running the task here is harmless.
- name: Add SMB user if not present
  ansible.builtin.user:
    name: "{{ smb_username }}"
    password: "{{ smb_password | password_hash('sha512') }}"
    state: present
    system: true
    shell: /usr/sbin/nologin

# --- Pool ---
- name: Check if storage-pool exists
  ansible.builtin.command: zpool list storage-pool
  register: zfs_zpool_check
  changed_when: false
  failed_when: false

- name: Create mirrored zfs pool
  ansible.builtin.command:
    argv:
      - zpool
      - create
      - -m
      - /mnt/storage
      - storage-pool
      - mirror
      - "/dev/disk/by-partuuid/{{ zfs_disk1_partuuid }}"
      - "/dev/disk/by-partuuid/{{ zfs_disk2_partuuid }}"
  changed_when: true
  when: zfs_zpool_check.rc != 0

# --- Dataset ---
- name: Create zfs dataset
  community.general.zfs:
    name: storage-pool/data
    state: present

- name: Set permissions for zfs dataset
  ansible.builtin.file:
    path: /mnt/storage/data
    owner: "{{ smb_username }}"
    group: "{{ smb_username }}"
    mode: '0755'
